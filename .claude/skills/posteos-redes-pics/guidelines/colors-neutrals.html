<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--paper)}.m{font:500 11px/1.3 var(--font-mono);letter-spacing:.02em}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);height:150px"><div style="background:var(--ink);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;"><div style="font-weight:700;font-size:14px">Ink</div><div class="m">--ink<br>#0B0B0B</div></div><div style="background:var(--graphite);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;"><div style="font-weight:700;font-size:14px">Graphite</div><div class="m">--graphite<br>#2B2B2B</div></div><div style="background:var(--mute);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;"><div style="font-weight:700;font-size:14px">Mute · solo texto secundario</div><div class="m">--mute<br>#5E5E5E</div></div><div style="background:var(--hairline);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:#0B0B0B;"><div style="font-weight:700;font-size:14px">Hairline · solo filetes</div><div class="m">--hairline<br>#D4D3CF</div></div><div style="background:var(--paper);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:#0B0B0B;box-shadow:inset 0 0 0 1px var(--hairline)"><div style="font-weight:700;font-size:14px">Paper</div><div class="m">--paper<br>#FFFFFF</div></div></div></body></html>
